name: Plugin Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: plugin-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          path: plugins
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release packages
        working-directory: plugins
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/plugin-release-notes.md"
          export RELEASE_CHANGELOG="$(cat "$RUNNER_TEMP/plugin-release-notes.md")"
          node scripts/package-release.mjs --out dist/release --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"

      - name: Upload release assets
        working-directory: plugins
        run: gh release upload "$RELEASE_TAG" dist/release/*.zip dist/release/catalog.json --repo "$GITHUB_REPOSITORY" --clobber
